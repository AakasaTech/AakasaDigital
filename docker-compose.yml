# ─────────────────────────────────────────────────────────────────────────────
# Aakasa Digital — full-stack docker-compose
#
# Services
#   aakasa-digital  → aakasa.dev / www.aakasa.dev   (port 3001 internal)
#   billcraft       → billcraft.aakasa.dev           (port 3000 internal)
#   supportcraft    → supportcraft.aakasa.dev        (port 3002 internal)
#   taskcraft       → taskcraft.aakasa.dev            (port 3003 internal)
#   pdfcraft        → pdfcraft.aakasa.dev             (port 3004 internal)
#   meetingcraft    → meetingcraft.aakasa.dev          (port 3000 internal)
#   meetingcraft-worker → same image, BullMQ reminder worker, no exposed port
#   nginx           → public HTTP :80 / HTTPS :443
#
# Usage
#   1. Copy .env.docker.example to .env and fill in all values
#   2. docker compose build          # builds all five Next.js images
#   3. docker compose up -d          # starts everything
#   4. docker compose logs -f        # stream logs
#
# IMPORTANT: NEXT_PUBLIC_* variables are baked into the image at build time
# (Next.js inlines them during `next build`). If you change any NEXT_PUBLIC_*
# value you must rebuild the affected image: docker compose build <service>
#
# All values below are read from `.env` (gitignored — see .env.docker.example
# for the template). Nothing in this file should ever be a literal secret.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Aakasa Digital — marketing site ─────────────────────────────────────────
  aakasa-digital:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RESEND_API_KEY: ${AAKASA_RESEND_API_KEY}
    networks:
      - aakasa-net

  # ── BillCraft AI ─────────────────────────────────────────────────────────────
  billcraft:
    build:
      context: ../BillCraft_AI
      dockerfile: Dockerfile
      args:
        # These are embedded into the JS bundle at build time
        NEXT_PUBLIC_SUPABASE_URL: ${BILLCRAFT_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${BILLCRAFT_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${BILLCRAFT_APP_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${BILLCRAFT_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${BILLCRAFT_PAYPAL_CLIENT_ID}
        # ALLOWED_ORIGINS must be a build arg — next.config.ts reads it at `next build` time
        ALLOWED_ORIGINS: ${BILLCRAFT_ALLOWED_ORIGINS}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Supabase
      SUPABASE_SERVICE_ROLE_KEY: ${BILLCRAFT_SUPABASE_SERVICE_ROLE_KEY}
      # OpenAI
      OPENAI_API_KEY: ${BILLCRAFT_OPENAI_API_KEY}
      # Resend
      RESEND_API_KEY: ${BILLCRAFT_RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${BILLCRAFT_RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${BILLCRAFT_RESEND_FROM_NAME}
      # Stripe
      STRIPE_SECRET_KEY: ${BILLCRAFT_STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${BILLCRAFT_STRIPE_WEBHOOK_SECRET}
      STRIPE_BASIC_MONTHLY_PRICE_ID: ${BILLCRAFT_STRIPE_BASIC_MONTHLY_PRICE_ID}
      STRIPE_BASIC_ANNUAL_PRICE_ID: ${BILLCRAFT_STRIPE_BASIC_ANNUAL_PRICE_ID}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${BILLCRAFT_STRIPE_PRO_MONTHLY_PRICE_ID}
      STRIPE_PRO_ANNUAL_PRICE_ID: ${BILLCRAFT_STRIPE_PRO_ANNUAL_PRICE_ID}
      STRIPE_AGENCY_MONTHLY_PRICE_ID: ${BILLCRAFT_STRIPE_AGENCY_MONTHLY_PRICE_ID}
      STRIPE_AGENCY_ANNUAL_PRICE_ID: ${BILLCRAFT_STRIPE_AGENCY_ANNUAL_PRICE_ID}
      # PayPal
      PAYPAL_CLIENT_ID: ${BILLCRAFT_PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${BILLCRAFT_PAYPAL_CLIENT_SECRET}
      PAYPAL_API_URL: ${BILLCRAFT_PAYPAL_API_URL}
      PAYPAL_WEBHOOK_ID: ${BILLCRAFT_PAYPAL_WEBHOOK_ID}
      PAYPAL_BASIC_MONTHLY_PLAN_ID: ${BILLCRAFT_PAYPAL_BASIC_MONTHLY_PLAN_ID}
      PAYPAL_BASIC_ANNUAL_PLAN_ID: ${BILLCRAFT_PAYPAL_BASIC_ANNUAL_PLAN_ID}
      PAYPAL_PRO_MONTHLY_PLAN_ID: ${BILLCRAFT_PAYPAL_PRO_MONTHLY_PLAN_ID}
      PAYPAL_PRO_ANNUAL_PLAN_ID: ${BILLCRAFT_PAYPAL_PRO_ANNUAL_PLAN_ID}
      PAYPAL_AGENCY_MONTHLY_PLAN_ID: ${BILLCRAFT_PAYPAL_AGENCY_MONTHLY_PLAN_ID}
      PAYPAL_AGENCY_ANNUAL_PLAN_ID: ${BILLCRAFT_PAYPAL_AGENCY_ANNUAL_PLAN_ID}
      # Google OAuth
      # GOOGLE_AUTH_FLOW: "custom"   → shows billcraft.aakasa.dev on account chooser (default)
      # GOOGLE_AUTH_FLOW: "supabase" → delegates to Supabase provider (use after enabling custom domain on Pro)
      GOOGLE_AUTH_FLOW: ${BILLCRAFT_GOOGLE_AUTH_FLOW}
      GOOGLE_CLIENT_ID: ${BILLCRAFT_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${BILLCRAFT_GOOGLE_CLIENT_SECRET}
      # Misc
      PORTAL_SESSION_SECRET: ${BILLCRAFT_PORTAL_SESSION_SECRET}
      CRON_SECRET: ${BILLCRAFT_CRON_SECRET}
      ADMIN_EMAILS: ${BILLCRAFT_ADMIN_EMAILS}
      EMAIL_PROVIDER: ${BILLCRAFT_EMAIL_PROVIDER}
      ALLOWED_ORIGINS: ${BILLCRAFT_ALLOWED_ORIGINS}
    networks:
      - aakasa-net

  # ── SupportCraft AI ──────────────────────────────────────────────────────────
  supportcraft:
    build:
      context: ../SupportCraft_AI
      dockerfile: Dockerfile
      args:
        # These are embedded into the JS bundle at build time
        NEXT_PUBLIC_SUPABASE_URL: ${SUPPORTCRAFT_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPPORTCRAFT_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${SUPPORTCRAFT_APP_URL}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${SUPPORTCRAFT_PAYPAL_CLIENT_ID}
        # Monthly plan IDs (baked into JS bundle for PayPal button)
        NEXT_PUBLIC_PAYPAL_PLAN_ID_FREELANCER_MONTHLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PUBLIC_FREELANCER_MONTHLY}
        NEXT_PUBLIC_PAYPAL_PLAN_ID_PRO: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PUBLIC_PRO}
        NEXT_PUBLIC_PAYPAL_PLAN_ID_BUSINESS: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PUBLIC_BUSINESS}
        NEXT_PUBLIC_PAYPAL_PLAN_ID_AGENCY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PUBLIC_AGENCY}
        # Yearly plan IDs
        NEXT_PUBLIC_PAYPAL_PLAN_ID_FREELANCER_YEARLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PUBLIC_FREELANCER_YEARLY}
        NEXT_PUBLIC_PAYPAL_PLAN_ID_PRO_YEARLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PUBLIC_PRO_YEARLY}
        NEXT_PUBLIC_PAYPAL_PLAN_ID_BUSINESS_YEARLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PUBLIC_BUSINESS_YEARLY}
        NEXT_PUBLIC_PAYPAL_PLAN_ID_AGENCY_YEARLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PUBLIC_AGENCY_YEARLY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # App URL — also needed at runtime by server-side routes (auth callbacks, invitation emails)
      NEXT_PUBLIC_APP_URL: ${SUPPORTCRAFT_APP_URL}
      # Database (Neon) — auth/orgs/tickets-read live here; the inbound email
      # pipeline still writes to the Supabase Postgres below until it migrates too
      DATABASE_URL: ${SUPPORTCRAFT_DATABASE_URL}
      # NextAuth
      NEXTAUTH_SECRET: ${SUPPORTCRAFT_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${SUPPORTCRAFT_APP_URL}
      # File storage (Cloudflare R2) — ticket + email attachments
      R2_ACCOUNT_ID: ${SUPPORTCRAFT_R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${SUPPORTCRAFT_R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${SUPPORTCRAFT_R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${SUPPORTCRAFT_R2_BUCKET}
      R2_PUBLIC_URL: ${SUPPORTCRAFT_R2_PUBLIC_URL}
      # Supabase — still backs business data (tickets/KB/admin) and the inbound
      # email pipeline; only auth and file storage have moved off it so far
      SUPABASE_SERVICE_ROLE_KEY: ${SUPPORTCRAFT_SUPABASE_SERVICE_ROLE_KEY}
      INBOUND_SECRET: ${SUPPORTCRAFT_INBOUND_SECRET}
      # AI provider
      AI_PROVIDER: ${SUPPORTCRAFT_AI_PROVIDER}
      OPENAI_API_KEY: ${SUPPORTCRAFT_OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${SUPPORTCRAFT_ANTHROPIC_API_KEY}
      # Email
      EMAIL_PROVIDER: ${SUPPORTCRAFT_EMAIL_PROVIDER}
      SENDING_DOMAIN: ${SUPPORTCRAFT_SENDING_DOMAIN}
      EMAIL_FROM: ${SUPPORTCRAFT_EMAIL_FROM}
      GMAIL_CLIENT_ID: ${SUPPORTCRAFT_GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${SUPPORTCRAFT_GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${SUPPORTCRAFT_GMAIL_REFRESH_TOKEN}
      RESEND_API_KEY: ${SUPPORTCRAFT_RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${SUPPORTCRAFT_RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${SUPPORTCRAFT_RESEND_FROM_NAME}
      # PayPal
      PAYPAL_CLIENT_ID: ${SUPPORTCRAFT_PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${SUPPORTCRAFT_PAYPAL_CLIENT_SECRET}
      PAYPAL_API_URL: ${SUPPORTCRAFT_PAYPAL_API_URL}
      PAYPAL_WEBHOOK_ID: ${SUPPORTCRAFT_PAYPAL_WEBHOOK_ID}
      # Server-side plan IDs (used by webhook to map subscription → DB plan)
      PAYPAL_PLAN_ID_FREELANCER_MONTHLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_FREELANCER_MONTHLY}
      PAYPAL_PLAN_ID_PRO: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PRO}
      PAYPAL_PLAN_ID_BUSINESS: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_BUSINESS}
      PAYPAL_PLAN_ID_AGENCY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_AGENCY}
      PAYPAL_PLAN_ID_FREELANCER_YEARLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_FREELANCER_YEARLY}
      PAYPAL_PLAN_ID_PRO_YEARLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_PRO_YEARLY}
      PAYPAL_PLAN_ID_BUSINESS_YEARLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_BUSINESS_YEARLY}
      PAYPAL_PLAN_ID_AGENCY_YEARLY: ${SUPPORTCRAFT_PAYPAL_PLAN_ID_AGENCY_YEARLY}
      # Google OAuth (Sign-In)
      GOOGLE_CLIENT_ID: ${SUPPORTCRAFT_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${SUPPORTCRAFT_GOOGLE_CLIENT_SECRET}
      # Misc
      CRON_SECRET: ${SUPPORTCRAFT_CRON_SECRET}
      ADMIN_EMAILS: ${SUPPORTCRAFT_ADMIN_EMAILS}
    networks:
      - aakasa-net

  # ── TaskCraft AI ─────────────────────────────────────────────────────────────
  taskcraft:
    build:
      context: ../TaskCraft_AI
      dockerfile: Dockerfile
      args:
        # These are embedded into the JS bundle at build time
        NEXT_PUBLIC_SUPABASE_URL: ${TASKCRAFT_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${TASKCRAFT_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${TASKCRAFT_APP_URL}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${TASKCRAFT_PAYPAL_CLIENT_ID}
        # Plan IDs baked into JS bundle for PayPal subscription buttons
        NEXT_PUBLIC_PAYPAL_PLAN_ID_SOLO_MONTHLY: ${TASKCRAFT_PAYPAL_PLAN_ID_SOLO_MONTHLY}
        NEXT_PUBLIC_PAYPAL_PLAN_ID_SOLO_YEARLY: ${TASKCRAFT_PAYPAL_PLAN_ID_SOLO_YEARLY}
        NEXT_PUBLIC_PAYPAL_PLAN_ID_TEAM_MONTHLY: ${TASKCRAFT_PAYPAL_PLAN_ID_TEAM_MONTHLY}
        NEXT_PUBLIC_PAYPAL_PLAN_ID_TEAM_YEARLY: ${TASKCRAFT_PAYPAL_PLAN_ID_TEAM_YEARLY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Supabase
      SUPABASE_SERVICE_ROLE_KEY: ${TASKCRAFT_SUPABASE_SERVICE_ROLE_KEY}
      # OpenAI
      OPENAI_API_KEY: ${TASKCRAFT_OPENAI_API_KEY}
      # PayPal
      PAYPAL_CLIENT_ID: ${TASKCRAFT_PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${TASKCRAFT_PAYPAL_CLIENT_SECRET}
      PAYPAL_API_URL: ${TASKCRAFT_PAYPAL_API_URL}
      PAYPAL_WEBHOOK_ID: ${TASKCRAFT_PAYPAL_WEBHOOK_ID}
      # Server-side plan IDs (used by webhook to map subscription → DB plan)
      PAYPAL_PLAN_ID_SOLO_MONTHLY: ${TASKCRAFT_PAYPAL_PLAN_ID_SOLO_MONTHLY}
      PAYPAL_PLAN_ID_SOLO_YEARLY: ${TASKCRAFT_PAYPAL_PLAN_ID_SOLO_YEARLY}
      PAYPAL_PLAN_ID_TEAM_MONTHLY: ${TASKCRAFT_PAYPAL_PLAN_ID_TEAM_MONTHLY}
      PAYPAL_PLAN_ID_TEAM_YEARLY: ${TASKCRAFT_PAYPAL_PLAN_ID_TEAM_YEARLY}
      # Google OAuth (custom PKCE flow)
      GOOGLE_AUTH_FLOW: ${TASKCRAFT_GOOGLE_AUTH_FLOW}
      GOOGLE_CLIENT_ID: ${TASKCRAFT_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${TASKCRAFT_GOOGLE_CLIENT_SECRET}
      # Misc
      ADMIN_EMAILS: ${TASKCRAFT_ADMIN_EMAILS}
      CRON_SECRET: ${TASKCRAFT_CRON_SECRET}
      # Email
      RESEND_API_KEY: ${TASKCRAFT_RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${TASKCRAFT_RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${TASKCRAFT_RESEND_FROM_NAME}
      # Internal Docker service URLs — bypasses nginx/public hostname for container-to-container calls
      BILLCRAFT_INTERNAL_URL: "http://billcraft:3000/api"
      SUPPORTCRAFT_INTERNAL_URL: "http://supportcraft:3002/api/v1"
    networks:
      - aakasa-net

  # ── MeetingCraft ─────────────────────────────────────────────────────────────
  meetingcraft:
    build:
      context: ../MeetingCraft
      dockerfile: Dockerfile
      args:
        # These are embedded into the JS bundle at build time
        NEXT_PUBLIC_SUPABASE_URL: ${MEETINGCRAFT_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${MEETINGCRAFT_SUPABASE_ANON_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Supabase
      SUPABASE_SERVICE_ROLE_KEY: ${MEETINGCRAFT_SUPABASE_SERVICE_ROLE_KEY}
      # Redis (Upstash)
      REDIS_URL: ${MEETINGCRAFT_REDIS_URL}
      # App
      APP_URL: ${MEETINGCRAFT_APP_URL}
      # AWS KMS — envelope-encrypts OAuth refresh tokens
      AWS_REGION: ${MEETINGCRAFT_AWS_REGION}
      AWS_KMS_KEY_ARN: ${MEETINGCRAFT_AWS_KMS_KEY_ARN}
      AWS_ACCESS_KEY_ID: ${MEETINGCRAFT_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MEETINGCRAFT_AWS_SECRET_ACCESS_KEY}
      # Google Calendar OAuth2
      GOOGLE_OAUTH_CLIENT_ID: ${MEETINGCRAFT_GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${MEETINGCRAFT_GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_CALENDAR_WEBHOOK_SECRET: ${MEETINGCRAFT_GOOGLE_CALENDAR_WEBHOOK_SECRET}
      # Google Sign-In (separate OAuth client from Calendar)
      GOOGLE_LOGIN_CLIENT_ID: ${MEETINGCRAFT_GOOGLE_LOGIN_CLIENT_ID}
      GOOGLE_LOGIN_CLIENT_SECRET: ${MEETINGCRAFT_GOOGLE_LOGIN_CLIENT_SECRET}
      # Zoom OAuth2
      ZOOM_OAUTH_CLIENT_ID: ${MEETINGCRAFT_ZOOM_OAUTH_CLIENT_ID}
      ZOOM_OAUTH_CLIENT_SECRET: ${MEETINGCRAFT_ZOOM_OAUTH_CLIENT_SECRET}
      # Microsoft Teams OAuth2
      MS_TEAMS_OAUTH_CLIENT_ID: ${MEETINGCRAFT_MS_TEAMS_OAUTH_CLIENT_ID}
      MS_TEAMS_OAUTH_CLIENT_SECRET: ${MEETINGCRAFT_MS_TEAMS_OAUTH_CLIENT_SECRET}
      MS_TEAMS_OAUTH_TENANT_ID: ${MEETINGCRAFT_MS_TEAMS_OAUTH_TENANT_ID}
      # Guest-facing booking management links
      BOOKING_GUEST_TOKEN_SECRET: ${MEETINGCRAFT_BOOKING_GUEST_TOKEN_SECRET}
      # Cron-triggered endpoints
      CRON_SECRET: ${MEETINGCRAFT_CRON_SECRET}
      # Email
      RESEND_API_KEY: ${MEETINGCRAFT_RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${MEETINGCRAFT_RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${MEETINGCRAFT_RESEND_FROM_NAME}
      # Misc
      ADMIN_EMAILS: ${MEETINGCRAFT_ADMIN_EMAILS}
      FEATURE_BILLING_ENABLED: ${MEETINGCRAFT_FEATURE_BILLING_ENABLED}
    networks:
      - aakasa-net

  # Same image as `meetingcraft`, running the BullMQ reminder worker instead
  # of the Next.js server (see MeetingCraft/src/worker.ts) — a separate
  # container so a stuck or crashing job queue can never take the booking UI
  # down with it, and vice versa. No exposed port: it never listens on HTTP.
  meetingcraft-worker:
    build:
      context: ../MeetingCraft
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${MEETINGCRAFT_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${MEETINGCRAFT_SUPABASE_ANON_KEY}
    restart: unless-stopped
    command: ['npm', 'run', 'worker']
    environment:
      NODE_ENV: production
      SUPABASE_SERVICE_ROLE_KEY: ${MEETINGCRAFT_SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: ${MEETINGCRAFT_REDIS_URL}
      APP_URL: ${MEETINGCRAFT_APP_URL}
      AWS_REGION: ${MEETINGCRAFT_AWS_REGION}
      AWS_KMS_KEY_ARN: ${MEETINGCRAFT_AWS_KMS_KEY_ARN}
      AWS_ACCESS_KEY_ID: ${MEETINGCRAFT_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MEETINGCRAFT_AWS_SECRET_ACCESS_KEY}
      RESEND_API_KEY: ${MEETINGCRAFT_RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${MEETINGCRAFT_RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${MEETINGCRAFT_RESEND_FROM_NAME}
      REMINDER_MINUTES_BEFORE: ${MEETINGCRAFT_REMINDER_MINUTES_BEFORE}
      NO_SHOW_FEEDBACK_DELAY_MINUTES: ${MEETINGCRAFT_NO_SHOW_FEEDBACK_DELAY_MINUTES}
    networks:
      - aakasa-net
    # The image's HEALTHCHECK checks an HTTP endpoint the worker never
    # exposes — it has no server to check. `restart: unless-stopped` already
    # recovers a crashed worker process.
    healthcheck:
      disable: true

  # ── PDF Merge ────────────────────────────────────────────────────────────────
  # Entirely client-side PDF processing — no database, no secrets. The only
  # build-time value is the canonical app URL used for metadata/OG tags.
  pdfcraft:
    build:
      context: ../PDFCraft
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${PDFCRAFT_APP_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - aakasa-net

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - aakasa-digital
      - billcraft
      - supportcraft
      - taskcraft
      - pdfcraft
      - meetingcraft
    networks:
      - aakasa-net

networks:
  aakasa-net:
    driver: bridge
