  # ── PDF Merge ────────────────────────────────────────────────────────────────
  # Entirely client-side PDF processing — no database, no secrets. The only
  # build-time value is the canonical app URL used for metadata/OG tags.
  pdfcraft:
    build:
      context: ../PDFCraft
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: "https://pdfcraft.aakasa.dev"
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - aakasa-net

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - aakasa-digital
      - billcraft
      - supportcraft
      - taskcraft
      - pdfcraft
    networks:
      - aakasa-net

networks:
  aakasa-net:
    driver: bridge
