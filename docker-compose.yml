  # ── Aakasa Digital — marketing site ─────────────────────────────────────────
  aakasa-digital:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - aakasa-net

