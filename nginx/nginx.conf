    #     listen 443 ssl http2;
    #     server_name aakasa.dev www.aakasa.dev;
    #     ssl_certificate     /etc/nginx/certs/aakasa.dev.crt;
    #     ssl_certificate_key /etc/nginx/certs/aakasa.dev.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
