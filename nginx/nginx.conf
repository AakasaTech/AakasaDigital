worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Shared proxy headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Large header buffers — required for Supabase JWT session cookies which
    # can exceed Nginx's default 4k proxy_buffer_size and cause 502 errors
    # on OAuth callbacks ("upstream sent too big header").
    proxy_buffer_size          16k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;

    # Shared SSL settings (wildcard cert covers all *.aakasa.dev + apex)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── HTTP → HTTPS redirect (all domains) ──────────────────────────────────
    server {
        listen 80;
        server_name aakasa.dev www.aakasa.dev billcraft.aakasa.dev supportcraft.aakasa.dev;
        return 301 https://$host$request_uri;
    }

    # ── aakasa.dev / www.aakasa.dev → Aakasa Digital (port 3001) ────────────
    server {
        listen 443 ssl http2;
        server_name aakasa.dev www.aakasa.dev;

        # Redirect www → apex
        if ($host = 'www.aakasa.dev') {
            return 301 https://aakasa.dev$request_uri;
        }

        location / {
            proxy_pass http://aakasa-digital:3001;
            proxy_set_header Host $host;
        }
    }

    # ── billcraft.aakasa.dev → BillCraft AI (port 3000) ──────────────────────
    server {
        listen 443 ssl http2;
        server_name billcraft.aakasa.dev;

        location / {
            proxy_pass http://billcraft:3000;
            proxy_set_header Host $host;
        }
    }

    # ── supportcraft.aakasa.dev → SupportCraft AI (port 3002) ────────────────
    server {
        listen 443 ssl http2;
        server_name supportcraft.aakasa.dev;

        location / {
            proxy_pass http://supportcraft:3002;
            proxy_set_header Host $host;
        }
    }
}
