worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Shared proxy headers — applied in each server block via include or direct set
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # ── aakasa.dev / www.aakasa.dev → Aakasa Digital (port 3001) ─────────────
    server {
        listen 80;
        server_name aakasa.dev www.aakasa.dev;

        # Redirect www → apex
        if ($host = 'www.aakasa.dev') {
            return 301 $scheme://aakasa.dev$request_uri;
        }

        location / {
            proxy_pass http://aakasa-digital:3001;
            proxy_set_header Host $host;
        }
    }

    # ── billcraft.aakasa.dev → BillCraft AI (port 3000) ──────────────────────
    server {
        listen 80;
        server_name billcraft.aakasa.dev;

        location / {
            proxy_pass http://billcraft:3000;
            proxy_set_header Host $host;
        }
    }

    # ── supportcraft.aakasa.dev → SupportCraft AI (port 3002) ────────────────
    server {
        listen 80;
        server_name supportcraft.aakasa.dev;

        location / {
            proxy_pass http://supportcraft:3002;
            proxy_set_header Host $host;
        }
    }

    # ── HTTPS (SSL) ───────────────────────────────────────────────────────────
    # Uncomment and configure once SSL certificates are in place.
