# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy — Aakasa Digital platform
#
# Services
#   aakasa-digital  → aakasa.dev             (port 3001)
#   billcraft       → billcraft.aakasa.dev   (port 3000)
#   supportcraft    → supportcraft.aakasa.dev (port 3002)
#   taskcraft       → taskcraft.aakasa.dev   (port 3003)
#   pdfcraft        → pdfcraft.aakasa.dev    (port 3004)
# ─────────────────────────────────────────────────────────────────────────────

worker_processes      auto;
worker_rlimit_nofile  65535;
error_log             /var/log/nginx/error.log warn;
pid                   /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include           /etc/nginx/mime.types;
    default_type      application/octet-stream;
    server_tokens     off;                       # hide nginx version

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;      # batch packets on sendfile paths
    tcp_nodelay        on;      # no Nagle delay on keep-alive connections
    keepalive_timeout  75s;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Request body limit ────────────────────────────────────────────────────
    # SupportCraft allows 25 MB file attachments; 30 M gives a safe margin.
    client_max_body_size  30M;

    # ── WebSocket / upstream keepalive — Connection header routing ────────────
    # For WebSocket upgrade requests:   Connection: upgrade
    # For regular HTTP keep-alive:      Connection: "" (lets upstream pool reuse)
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       '';
    }

    # ── Upstream pools ────────────────────────────────────────────────────────
    # keepalive N — how many idle TCP connections nginx holds open per worker.
    # Eliminates the TCP handshake overhead on every proxied request.
    upstream aakasa_digital {
        server    aakasa-digital:3001;
        keepalive 16;
    }
    upstream billcraft_app {
        server    billcraft:3000;
        keepalive 16;
    }
    upstream supportcraft_app {
        server    supportcraft:3002;
        keepalive 16;
    }
    upstream taskcraft_app {
        server    taskcraft:3003;
        keepalive 16;
    }
    upstream pdfcraft_app {
        server    pdfcraft:3004;
        keepalive 16;
    }

    # ── Shared proxy settings ─────────────────────────────────────────────────
    proxy_http_version      1.1;                 # required for upstream keepalive
    proxy_set_header        Upgrade           $http_upgrade;
    proxy_set_header        Connection        $connection_upgrade;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_cache_bypass      $http_upgrade;
    proxy_connect_timeout   10s;
    proxy_send_timeout      120s;   # raised: AI streaming responses can take 60 s+
    proxy_read_timeout      120s;   # raised: same reason

    # Large header buffers — Supabase JWT session cookies can exceed the default
    # 4 k proxy_buffer_size and cause 502 "upstream sent too big header" errors
    # on OAuth callbacks.
    proxy_buffer_size           64k;
    proxy_buffers               4 64k;
    proxy_busy_buffers_size     128k;

    # ── SSL — shared wildcard cert (*.aakasa.dev + apex) ─────────────────────
    ssl_certificate         /etc/nginx/certs/server.crt;
    ssl_certificate_key     /etc/nginx/certs/server.key;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;    # disable tickets to preserve forward secrecy

    # ── Security response headers ─────────────────────────────────────────────
    # Declared at http level so every server block inherits them.
    # IMPORTANT: do NOT add any add_header inside server {} or location {} blocks
    # — nginx drops all parent add_header directives the moment a child block
    # declares its own, so repeat them wherever needed if you need per-location
    # overrides.
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-XSS-Protection         "1; mode=block"                    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen      80;
        server_name aakasa.dev www.aakasa.dev billcraft.aakasa.dev supportcraft.aakasa.dev taskcraft.aakasa.dev pdfcraft.aakasa.dev;
        return 301  https://$host$request_uri;
    }

    # ── www.aakasa.dev → apex (own block avoids `if` inside an SSL context) ──
    server {
        listen      443 ssl http2;
        server_name www.aakasa.dev;
        return 301  https://aakasa.dev$request_uri;
    }

    # ── aakasa.dev → Aakasa Digital (port 3001) ──────────────────────────────
    server {
        listen      443 ssl http2;
        server_name aakasa.dev;

        location / {
            proxy_pass http://aakasa_digital;
        }
    }

    # ── billcraft.aakasa.dev → BillCraft AI (port 3000) ──────────────────────
    server {
        listen      443 ssl http2;
        server_name billcraft.aakasa.dev;

        location / {
            proxy_pass http://billcraft_app;
        }
    }

    # ── supportcraft.aakasa.dev → SupportCraft AI (port 3002) ────────────────
    server {
        listen      443 ssl http2;
        server_name supportcraft.aakasa.dev;

        location / {
            proxy_pass http://supportcraft_app;
        }
    }

    # ── taskcraft.aakasa.dev → TaskCraft AI (port 3003) ──────────────────────
    server {
        listen      443 ssl http2;
        server_name taskcraft.aakasa.dev;

        location / {
            proxy_pass http://taskcraft_app;
        }
    }

    # ── pdfcraft.aakasa.dev → PDF Merge (port 3004) ───────────────────────────
    server {
        listen      443 ssl http2;
        server_name pdfcraft.aakasa.dev;

        location / {
            proxy_pass http://pdfcraft_app;
        }
    }
}
